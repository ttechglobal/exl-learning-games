<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="coreBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#082028"/>
      <stop offset="100%" stop-color="#031012"/>
    </radialGradient>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#coreBg)"/>

  <!-- Grid lines — reactor floor -->
  <g stroke="#082028" stroke-width="1" opacity="0.6">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Central reactor glow -->
  <ellipse cx="600" cy="380" rx="300" ry="300" fill="url(#reactorGlow)" filter="url(#blur12)"/>

  <!-- Orbital rings — central atom model -->
  <ellipse cx="600" cy="380" rx="220" ry="80" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
  <ellipse cx="600" cy="380" rx="160" ry="140" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.18" transform="rotate(60 600 380)"/>
  <ellipse cx="600" cy="380" rx="160" ry="140" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.18" transform="rotate(-60 600 380)"/>

  <!-- Nucleus -->
  <ellipse cx="600" cy="380" rx="50" ry="50" fill="#00d4ff" opacity="0.08" filter="url(#blur6)"/>
  <circle cx="600" cy="380" r="22" fill="#041c24"/>
  <circle cx="593" cy="374" r="8" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="608" cy="374" r="8" fill="#aaaacc" opacity="0.85"/>
  <circle cx="597" cy="386" r="8" fill="#aaaacc" opacity="0.85"/>
  <circle cx="610" cy="386" r="8" fill="#ff6b6b" opacity="0.9"/>

  <!-- Electrons -->
  <circle cx="820" cy="380" r="7" fill="#00d4ff" opacity="0.8" filter="url(#blur6)"/>
  <circle cx="380" cy="380" r="7" fill="#00d4ff" opacity="0.8" filter="url(#blur6)"/>
  <circle cx="720" cy="248" r="7" fill="#00d4ff" opacity="0.75" filter="url(#blur6)"/>
  <circle cx="480" cy="512" r="7" fill="#00d4ff" opacity="0.75" filter="url(#blur6)"/>
  <circle cx="720" cy="512" r="7" fill="#00d4ff" opacity="0.7" filter="url(#blur6)"/>
  <circle cx="480" cy="248" r="7" fill="#00d4ff" opacity="0.7" filter="url(#blur6)"/>

  <!-- Floating atom models (background, smaller) -->
  <g opacity="0.15">
    <ellipse cx="180" cy="180" rx="70" ry="25" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <ellipse cx="180" cy="180" rx="50" ry="45" fill="none" stroke="#00d4ff" stroke-width="1" transform="rotate(60 180 180)"/>
    <circle cx="180" cy="180" r="10" fill="#00d4ff" opacity="0.4"/>
  </g>
  <g opacity="0.12">
    <ellipse cx="1020" cy="620" rx="80" ry="28" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <ellipse cx="1020" cy="620" rx="55" ry="50" fill="none" stroke="#00d4ff" stroke-width="1" transform="rotate(60 1020 620)"/>
    <circle cx="1020" cy="620" r="12" fill="#00d4ff" opacity="0.4"/>
  </g>
  <g opacity="0.1">
    <ellipse cx="1050" cy="150" rx="60" ry="22" fill="none" stroke="#00ffcc" stroke-width="1"/>
    <circle cx="1050" cy="150" r="8" fill="#00ffcc" opacity="0.3"/>
  </g>

  <!-- Reactor panels / walls -->
  <rect x="0" y="0" width="80" height="800" fill="#031012" opacity="0.7"/>
  <rect x="1120" y="0" width="80" height="800" fill="#031012" opacity="0.7"/>

  <!-- Panel details left -->
  <rect x="15" y="100" width="50" height="80" rx="4" fill="#041c24" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <rect x="20" y="110" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.15"/>
  <rect x="20" y="128" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.1"/>
  <rect x="20" y="146" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.12"/>
  <rect x="15" y="220" width="50" height="50" rx="4" fill="#041c24" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="40" cy="245" r="14" fill="#00d4ff" opacity="0.05" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Panel details right -->
  <rect x="1135" y="120" width="50" height="80" rx="4" fill="#041c24" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <rect x="1140" y="130" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.15"/>
  <rect x="1140" y="148" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.1"/>
  <rect x="1140" y="166" width="40" height="12" rx="2" fill="#00d4ff" opacity="0.12"/>

  <!-- Floor glow -->
  <ellipse cx="600" cy="700" rx="400" ry="60" fill="#00d4ff" opacity="0.04" filter="url(#blur12)"/>
  <rect x="0" y="730" width="1200" height="70" fill="#020a0e" opacity="0.8"/>
</svg>
