<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0618"/>
      <stop offset="100%" stop-color="#12082a"/>
    </linearGradient>
    <radialGradient id="spotlightGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#hallBg)"/>

  <!-- Spotlight from top -->
  <ellipse cx="600" cy="0" rx="350" ry="400" fill="url(#spotlightGlow)" filter="url(#blur10)"/>

  <!-- Periodic table tiles — background wall -->
  <!-- Row 1 -->
  <g opacity="0.18">
    <g transform="translate(80,60)">
      <rect width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.8"/>
      <text x="26" y="22" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle" opacity="0.8">1</text>
      <text x="26" y="38" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">H</text>
      <text x="26" y="50" font-family="Arial" font-size="7" fill="#e9d5ff" text-anchor="middle">1.008</text>
    </g>
    <g transform="translate(1068,60)">
      <rect width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.8"/>
      <text x="26" y="22" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle" opacity="0.8">2</text>
      <text x="26" y="38" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">He</text>
      <text x="26" y="50" font-family="Arial" font-size="7" fill="#e9d5ff" text-anchor="middle">4.003</text>
    </g>
  </g>

  <!-- Rows 2-4 tiles (dimmed background) -->
  <g opacity="0.1">
    <!-- Row 2 -->
    <rect x="80"  y="122" width="52" height="52" rx="4" fill="#7c3aed" stroke="#a855f7" stroke-width="0.5"/>
    <rect x="1068" y="122" width="52" height="52" rx="4" fill="#1d4ed8" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="456" y="122" width="52" height="52" rx="4" fill="#047857" stroke="#10b981" stroke-width="0.5"/>
    <rect x="516" y="122" width="52" height="52" rx="4" fill="#047857" stroke="#10b981" stroke-width="0.5"/>
    <rect x="576" y="122" width="52" height="52" rx="4" fill="#dc2626" stroke="#f87171" stroke-width="0.5"/>
    <rect x="636" y="122" width="52" height="52" rx="4" fill="#dc2626" stroke="#f87171" stroke-width="0.5"/>
    <rect x="696" y="122" width="52" height="52" rx="4" fill="#b45309" stroke="#fbbf24" stroke-width="0.5"/>
    <rect x="756" y="122" width="52" height="52" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="0.5"/>
    <rect x="816" y="122" width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="876" y="122" width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="936" y="122" width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="996" y="122" width="52" height="52" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="0.5"/>
    <!-- Row 3 -->
    <rect x="80"  y="184" width="52" height="52" rx="4" fill="#7c3aed" stroke="#a855f7" stroke-width="0.5"/>
    <rect x="140" y="184" width="52" height="52" rx="4" fill="#7c3aed" stroke="#a855f7" stroke-width="0.5"/>
    <rect x="456" y="184" width="52" height="52" rx="4" fill="#166534" stroke="#22c55e" stroke-width="0.5"/>
    <rect x="516" y="184" width="52" height="52" rx="4" fill="#166534" stroke="#22c55e" stroke-width="0.5"/>
    <rect x="576" y="184" width="52" height="52" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="0.5"/>
    <rect x="636" y="184" width="52" height="52" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="0.5"/>
    <rect x="696" y="184" width="52" height="52" rx="4" fill="#92400e" stroke="#f59e0b" stroke-width="0.5"/>
    <rect x="756" y="184" width="52" height="52" rx="4" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
    <rect x="1068" y="184" width="52" height="52" rx="4" fill="#1d4ed8" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="936" y="184" width="52" height="52" rx="4" fill="#065f46" stroke="#10b981" stroke-width="0.5"/>
    <rect x="996" y="184" width="52" height="52" rx="4" fill="#065f46" stroke="#10b981" stroke-width="0.5"/>
  </g>

  <!-- HIGHLIGHTED tile (currently hunted element) -->
  <g transform="translate(576,246)">
    <rect width="52" height="52" rx="5" fill="#a855f7" stroke="#e879f9" stroke-width="2" filter="url(#blur5)" opacity="0.6"/>
    <rect width="52" height="52" rx="5" fill="#7e22ce" stroke="#e879f9" stroke-width="2"/>
    <text x="26" y="17" font-family="Arial" font-size="8" fill="#e9d5ff" text-anchor="middle">17</text>
    <text x="26" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Cl</text>
    <text x="26" y="49" font-family="Arial" font-size="7" fill="#e9d5ff" text-anchor="middle">35.45</text>
  </g>
  <!-- Spotlight on the highlighted tile -->
  <ellipse cx="602" cy="272" rx="80" ry="60" fill="#a855f7" opacity="0.1" filter="url(#blur10)"/>

  <!-- Timer / HUD frame (top) -->
  <rect x="0" y="0" width="1200" height="45" fill="#050310" opacity="0.85"/>
  <rect x="480" y="8" width="240" height="28" rx="6" fill="#1a0a30" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
  <text x="600" y="27" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle" opacity="0.7">HUNT: Cl · Halogen · Period 3</text>

  <!-- Side panels -->
  <rect x="0" y="0" width="70" height="800" fill="#050310" opacity="0.8"/>
  <rect x="1130" y="0" width="70" height="800" fill="#050310" opacity="0.8"/>

  <!-- Score / streak panels -->
  <rect x="8" y="60" width="54" height="60" rx="4" fill="#1a0a30" stroke="#a855f7" stroke-width="0.7" opacity="0.5"/>
  <text x="35" y="80" font-family="Arial" font-size="7" fill="#c084fc" text-anchor="middle" opacity="0.7">SCORE</text>
  <text x="35" y="100" font-family="Arial" font-size="16" font-weight="700" fill="#a855f7" text-anchor="middle" opacity="0.8">842</text>
  <text x="35" y="114" font-family="Arial" font-size="7" fill="#c084fc" text-anchor="middle" opacity="0.6">pts</text>

  <rect x="8" y="132" width="54" height="50" rx="4" fill="#1a0a30" stroke="#a855f7" stroke-width="0.7" opacity="0.4"/>
  <text x="35" y="152" font-family="Arial" font-size="7" fill="#c084fc" text-anchor="middle" opacity="0.6">STREAK</text>
  <text x="35" y="170" font-family="Arial" font-size="14" font-weight="700" fill="#f0abfc" text-anchor="middle" opacity="0.7">×5</text>

  <!-- Floor -->
  <rect x="0" y="680" width="1200" height="120" fill="#050310" opacity="0.85"/>
  <line x1="0" y1="680" x2="1200" y2="680" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
</svg>
