<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="officeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deskLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#officeBg)"/>

  <!-- Lamp glow from above -->
  <ellipse cx="600" cy="0" rx="280" ry="250" fill="url(#lampLight)" filter="url(#blur8)"/>

  <!-- Left wall — cork pinboard -->
  <rect x="0" y="60" width="340" height="580" rx="0" fill="#0e1018" opacity="0.95"/>
  <rect x="10" y="70" width="320" height="560" rx="6" fill="#140e08" opacity="0.9"/>

  <!-- Pinboard string lines -->
  <line x1="60"  y1="140" x2="290" y2="240" stroke="#cc4400" stroke-width="0.8" opacity="0.4"/>
  <line x1="80"  y1="320" x2="280" y2="180" stroke="#cc4400" stroke-width="0.8" opacity="0.35"/>
  <line x1="50"  y1="440" x2="300" y2="340" stroke="#cc4400" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="200" x2="260" y2="460" stroke="#cc4400" stroke-width="0.8" opacity="0.3"/>

  <!-- Case file cards on pinboard -->
  <g transform="rotate(-5 130 160) translate(30,120)">
    <rect width="100" height="70" rx="3" fill="#f5f0e0" opacity="0.85"/>
    <line x1="10" y1="20" x2="90" y2="20" stroke="#888" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="30" x2="90" y2="30" stroke="#888" stroke-width="1" opacity="0.3"/>
    <line x1="10" y1="40" x2="75" y2="40" stroke="#888" stroke-width="1" opacity="0.3"/>
    <text x="50" y="14" font-family="Arial" font-size="7" fill="#333" text-anchor="middle" font-weight="700">CASE #0042</text>
    <text x="50" y="55" font-family="Georgia,serif" font-size="10" fill="#222" text-anchor="middle">2x + y = 7</text>
    <circle cx="50" cy="2" r="3" fill="#cc0000" opacity="0.8"/>
  </g>

  <g transform="rotate(4 200 300) translate(150,260)">
    <rect width="90" height="65" rx="3" fill="#e8e0d0" opacity="0.8"/>
    <text x="45" y="14" font-family="Arial" font-size="7" fill="#333" text-anchor="middle" font-weight="700">CASE #0041</text>
    <text x="45" y="35" font-family="Georgia,serif" font-size="10" fill="#222" text-anchor="middle">x - y = 3</text>
    <text x="45" y="52" font-family="Georgia,serif" font-size="8" fill="#555" text-anchor="middle">CLOSED ✓</text>
    <circle cx="45" cy="2" r="3" fill="#006600" opacity="0.8"/>
  </g>

  <g transform="rotate(-3 80 400) translate(40,380)">
    <rect width="110" height="75" rx="3" fill="#fff8e8" opacity="0.8"/>
    <text x="55" y="14" font-family="Arial" font-size="7" fill="#333" text-anchor="middle" font-weight="700">EVIDENCE</text>
    <text x="55" y="35" font-family="Georgia,serif" font-size="9" fill="#222" text-anchor="middle">3x + 2y = 16</text>
    <text x="55" y="50" font-family="Georgia,serif" font-size="9" fill="#222" text-anchor="middle">x + 4y = 14</text>
    <circle cx="55" cy="2" r="3" fill="#cc8800" opacity="0.8"/>
  </g>

  <!-- Chalkboard (centre-right) -->
  <rect x="400" y="55" width="480" height="340" rx="8" fill="#0a1a10" opacity="0.95"/>
  <rect x="412" y="67" width="456" height="316" rx="5" fill="#0d2015" opacity="0.9"/>
  <!-- Chalkboard frame -->
  <rect x="400" y="55" width="480" height="340" rx="8" fill="none" stroke="#2a1a08" stroke-width="6"/>
  <rect x="400" y="55" width="480" height="340" rx="8" fill="none" stroke="#3a2808" stroke-width="2"/>

  <!-- Chalk equations -->
  <text x="640" y="115" font-family="Georgia,serif" font-size="22" fill="#d4e8d4" text-anchor="middle" opacity="0.8">2x + y = 7</text>
  <text x="640" y="155" font-family="Georgia,serif" font-size="22" fill="#d4e8d4" text-anchor="middle" opacity="0.8">x − y = 2</text>
  <line x1="470" y1="170" x2="810" y2="170" stroke="#d4e8d4" stroke-width="1" opacity="0.35"/>
  <text x="530" y="200" font-family="Georgia,serif" font-size="14" fill="#d4e8d4" text-anchor="middle" opacity="0.55">×1</text>
  <text x="640" y="205" font-family="Georgia,serif" font-size="18" fill="#a0c8a0" text-anchor="middle" opacity="0.7">3x = 9</text>
  <text x="640" y="245" font-family="Georgia,serif" font-size="20" fill="#f59e0b" text-anchor="middle" opacity="0.85">x = 3</text>
  <text x="640" y="285" font-family="Georgia,serif" font-size="18" fill="#a0c8a0" text-anchor="middle" opacity="0.65">y = 1</text>
  <!-- Chalk dust marks -->
  <ellipse cx="475" cy="170" rx="12" ry="3" fill="#d4e8d4" opacity="0.08"/>
  <ellipse cx="810" cy="170" rx="10" ry="3" fill="#d4e8d4" opacity="0.06"/>

  <!-- Chalk tray -->
  <rect x="400" y="394" width="480" height="18" rx="3" fill="#1a1008" opacity="0.9"/>
  <rect x="420" y="398" width="28" height="8" rx="2" fill="#d4d4c0" opacity="0.55"/>
  <rect x="455" y="398" width="28" height="8" rx="2" fill="#c0c0b0" opacity="0.45"/>
  <rect x="490" y="398" width="28" height="8" rx="2" fill="#f59e0b" opacity="0.4"/>

  <!-- Desk (foreground) -->
  <rect x="200" y="560" width="800" height="200" rx="8" fill="#1a1008" opacity="0.95"/>
  <rect x="200" y="560" width="800" height="20" rx="8" fill="#2a1a0a" opacity="0.95"/>
  <!-- Desk lamp -->
  <rect x="570" y="490" width="6" height="80" rx="3" fill="#2a2a2a"/>
  <path d="M573 490 Q620 460 660 470" stroke="#2a2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="660" cy="470" rx="25" ry="12" fill="#444" opacity="0.9"/>
  <ellipse cx="660" cy="530" rx="80" ry="40" fill="url(#deskLight)" filter="url(#blur8)"/>
  <!-- Papers on desk -->
  <g transform="rotate(-3 550 600)">
    <rect x="480" y="575" width="140" height="100" rx="3" fill="#f0ead8" opacity="0.85"/>
    <line x1="495" y1="595" x2="605" y2="595" stroke="#888" stroke-width="1" opacity="0.35"/>
    <line x1="495" y1="607" x2="605" y2="607" stroke="#888" stroke-width="1" opacity="0.3"/>
    <line x1="495" y1="619" x2="590" y2="619" stroke="#888" stroke-width="1" opacity="0.3"/>
    <text x="550" y="650" font-family="Georgia,serif" font-size="11" fill="#333" text-anchor="middle">x = 3, y = 1</text>
  </g>
  <!-- Coffee mug -->
  <ellipse cx="730" cy="600" rx="20" ry="8" fill="#1a0a04" opacity="0.9"/>
  <rect x="710" y="590" width="40" height="36" rx="4" fill="#1a0a04" opacity="0.9"/>
  <path d="M750 600 Q762 600 762 612 Q762 624 750 624" stroke="#2a1204" stroke-width="4" fill="none"/>
  <ellipse cx="730" cy="592" rx="18" ry="7" fill="#3a1208" opacity="0.85"/>

  <!-- Right wall shadow -->
  <rect x="950" y="60" width="250" height="640" fill="#070810" opacity="0.7"/>

  <!-- Floor -->
  <rect x="0" y="720" width="1200" height="80" fill="#060810" opacity="0.9"/>
</svg>
