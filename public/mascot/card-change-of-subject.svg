<svg viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" width="280" height="200">
  <defs>
    <!-- Notebook paper warm cream -->
    <linearGradient id="cs-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#fdf8ed"/>
    </linearGradient>
    <!-- Gold tile gradient -->
    <linearGradient id="cs-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Teal zone gradient -->
    <linearGradient id="cs-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <!-- Answer zone glow -->
    <radialGradient id="cs-answer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <!-- Banner gradient -->
    <linearGradient id="cs-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a20"/>
      <stop offset="100%" stop-color="#0f2210"/>
    </linearGradient>
    <!-- Vignette — very subtle, cream-to-slightly-darker -->
    <radialGradient id="cs-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d4a820" stop-opacity="0.08"/>
    </radialGradient>
    <!-- Floating tile shadow -->
    <filter id="cs-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b45309" flood-opacity="0.3"/>
    </filter>
    <filter id="cs-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cs-text-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <clipPath id="cs-clip">
      <rect width="280" height="200" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cs-clip)">
    <!-- BACKGROUND: notebook paper -->
    <rect width="280" height="200" fill="url(#cs-paper)"/>

    <!-- Notebook horizontal ruled lines -->
    <line x1="0" y1="38"  x2="280" y2="38"  stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="57"  x2="280" y2="57"  stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="76"  x2="280" y2="76"  stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="95"  x2="280" y2="95"  stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="114" x2="280" y2="114" stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="133" x2="280" y2="133" stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>
    <line x1="0" y1="152" x2="280" y2="152" stroke="#dde8e0" stroke-width="0.8" opacity="0.7"/>

    <!-- Left margin line (red, like a real notebook) -->
    <line x1="38" y1="0" x2="38" y2="175" stroke="#f9a8a8" stroke-width="1.2" opacity="0.6"/>

    <!-- Spiral binding holes on left -->
    <circle cx="15" cy="28"  r="5.5" fill="#e8e0d0" stroke="#c8b890" stroke-width="1"/>
    <circle cx="15" cy="58"  r="5.5" fill="#e8e0d0" stroke="#c8b890" stroke-width="1"/>
    <circle cx="15" cy="88"  r="5.5" fill="#e8e0d0" stroke="#c8b890" stroke-width="1"/>
    <circle cx="15" cy="118" r="5.5" fill="#e8e0d0" stroke="#c8b890" stroke-width="1"/>
    <circle cx="15" cy="148" r="5.5" fill="#e8e0d0" stroke="#c8b890" stroke-width="1"/>
    <!-- Spiral wire across holes -->
    <path d="M10,20 Q20,24 10,28 Q20,32 10,36 Q20,40 10,44 Q20,48 10,52 Q20,56 10,60 Q20,64 10,68 Q20,72 10,76 Q20,80 10,84 Q20,88 10,92 Q20,96 10,100 Q20,104 10,108 Q20,112 10,116 Q20,120 10,124 Q20,128 10,132 Q20,136 10,140 Q20,144 10,148 Q20,152 10,156"
          stroke="#a89060" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- ════════════════════════════════════════
         MAIN FORMULA DISPLAY — the core interaction
         Shows: v = u + at  →  rearrange to make 'a' the subject
         Result: a = (v−u)/t
    ════════════════════════════════════════ -->

    <!-- "Make 'a' the subject" instruction banner (yellow sticky) -->
    <rect x="46" y="12" width="222" height="22" rx="4" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="157" y="26" text-anchor="middle" font-family="'Kalam', 'Comic Sans MS', cursive" font-size="11"
          font-weight="700" fill="#92400e">Make  a  the subject of  v = u + at</text>

    <!-- ORIGINAL FORMULA — left side of equals, shown in standard ink -->
    <!-- The full equation: v = u + at -->
    <!-- Left box (active / being worked) -->
    <rect x="46" y="44" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"
          stroke-dasharray="4 2"/>
    <text x="98" y="61" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="11" fill="#78350f" opacity="0.6">working side</text>
    <!-- v term (plain) -->
    <text x="60" y="80" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20"
          font-weight="700" fill="#1e3a20" filter="url(#cs-text-shadow)">v − u</text>

    <!-- Equals sign -->
    <text x="155" y="80" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="24" font-weight="700" fill="#6b7280">=</text>

    <!-- RIGHT side — the answer zone (teal, glowing) -->
    <ellipse cx="210" cy="75" rx="45" ry="28" fill="url(#cs-answer-glow)"/>
    <rect x="168" y="44" width="100" height="46" rx="8" fill="url(#cs-teal)" stroke="#10b981"
          stroke-width="2"/>
    <!-- "a × t" showing what's been isolated so far — with fraction line -->
    <!-- Fraction: (v-u)/t -->
    <text x="218" y="64" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="16" font-weight="700" fill="#065f46">a</text>
    <line x1="178" y1="70" x2="258" y2="70" stroke="#065f46" stroke-width="2" opacity="0.4"/>
    <!-- (placeholder for what's being calculated) -->
    <text x="218" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="13" font-weight="600" fill="#065f46" opacity="0.7">× t</text>

    <!-- Checkmark badge on answer zone -->
    <circle cx="262" cy="48" r="9" fill="#10b981"/>
    <text x="262" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff" font-weight="700">✓</text>

    <!-- ═══════════════════════════════
         OPERATION TILES — the interactive draggable elements
         Shown in a bank below, one being dragged over
    ═══════════════════════════════ -->

    <!-- Tile bank label -->
    <text x="50" y="108" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700"
          fill="#78350f" letter-spacing="0.06em" text-transform="uppercase" opacity="0.7">OPERATION TILES</text>

    <!-- TILE 1: ÷t (being used / placed — shown floating over the equation) -->
    <!-- This is the "in-flight" tile with a shadow, positioned over the right zone -->
    <rect x="170" y="100" width="50" height="34" rx="8" fill="url(#cs-gold)" filter="url(#cs-shadow)"
          transform="rotate(-4, 195, 117)"/>
    <text x="195" y="122" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="18" font-weight="800" fill="#fff" filter="url(#cs-shadow)" transform="rotate(-4, 195, 117)">÷t</text>

    <!-- TILE 2: ×t (in bank, unused) -->
    <rect x="50" y="116" width="44" height="32" rx="7" fill="url(#cs-gold)" opacity="0.3"/>
    <text x="72" y="137" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="16" font-weight="700" fill="#78350f" opacity="0.5">×t</text>

    <!-- TILE 3: −u  (in bank) -->
    <rect x="100" y="116" width="44" height="32" rx="7" fill="url(#cs-gold)"/>
    <text x="122" y="137" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="16" font-weight="700" fill="#fff">−u</text>

    <!-- TILE 4: +u (used/faded) -->
    <rect x="150" y="116" width="44" height="32" rx="7" fill="url(#cs-gold)" opacity="0.22"/>
    <text x="172" y="137" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="16" font-weight="700" fill="#78350f" opacity="0.35">+u</text>
    <!-- ✓ tick on used tile -->
    <circle cx="187" cy="118" r="7" fill="#10b981" opacity="0.8"/>
    <text x="187" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fff">✓</text>

    <!-- Curved arrow showing tile being dragged across equals sign -->
    <path d="M160,115 Q158,98 173,106" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"
          marker-end="url(#arrow-gold)"/>
    <defs>
      <marker id="arrow-gold" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
      </marker>
    </defs>

    <!-- ═══════════════════════════════
         STEP TRACKER — progress dots
    ═══════════════════════════════ -->
    <text x="50" y="163" font-family="'Inter', sans-serif" font-size="8" font-weight="700"
          fill="#78350f" opacity="0.6" letter-spacing="0.05em">STEPS</text>

    <!-- Step dots: 3 done (teal), 1 active (gold), 1 remaining (grey) -->
    <circle cx="90"  cy="159" r="6" fill="#10b981"/>
    <text x="90" y="163" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">✓</text>

    <circle cx="108" cy="159" r="6" fill="#10b981"/>
    <text x="108" y="163" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">✓</text>

    <circle cx="126" cy="159" r="6" fill="#10b981"/>
    <text x="126" y="163" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">✓</text>

    <!-- Active step — gold, pulsing ring -->
    <circle cx="144" cy="159" r="8" fill="#fbbf24" opacity="0.25"/>
    <circle cx="144" cy="159" r="6" fill="#fbbf24"/>
    <text x="144" y="163" text-anchor="middle" font-size="8" fill="#fff" font-weight="800">4</text>

    <!-- Remaining steps -->
    <circle cx="162" cy="159" r="6" fill="#e5e7eb"/>
    <circle cx="180" cy="159" r="6" fill="#e5e7eb"/>

    <!-- Score chip top-right -->
    <rect x="220" y="150" width="52" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="246" y="164" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="10" font-weight="700" fill="#92400e">+240 pts</text>

    <!-- ═══════════════════════════════
         TITLE BANNER at bottom
    ═══════════════════════════════ -->
    <rect x="0" y="173" width="280" height="27" fill="url(#cs-banner)"/>
    <!-- Left gold accent stripe -->
    <rect x="0" y="173" width="5" height="27" fill="#c9a227"/>
    <text x="144" y="187" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="9.5" font-weight="700" fill="#c9a227" letter-spacing="0.3">CHANGE OF SUBJECT FORMULA</text>
    <text x="144" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="6.5" fill="#6ee7b7" opacity="0.9" letter-spacing="0.2">Drag tiles · Isolate the variable · Win</text>

    <!-- Subtle vignette warmth -->
    <rect width="280" height="200" fill="url(#cs-vignette)"/>
  </g>
</svg>