<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="mirrorBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3040"/>
      <stop offset="100%" stop-color="#3a4860"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="url(#bg)"/>

  <!-- Lab floor line -->
  <line x1="0" y1="155" x2="280" y2="155" stroke="#1a2535" stroke-width="1.5"/>
  <!-- Grid lines (lab bench) -->
  <line x1="0" y1="145" x2="280" y2="145" stroke="#0e1620" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="135" x2="280" y2="135" stroke="#0e1620" stroke-width="0.5" opacity="0.4"/>

  <!-- Principal axis -->
  <line x1="0" y1="100" x2="280" y2="100" stroke="#2a3a50" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Curved concave mirror (right side) -->
  <path d="M218 55 Q240 100 218 145" stroke="url(#mirrorBody)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M218 55 Q240 100 218 145" stroke="#8aaccc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Mirror stand -->
  <rect x="215" y="145" width="14" height="10" rx="2" fill="#2a3040"/>
  <rect x="217" y="153" width="10" height="4" rx="1" fill="#1a2030"/>

  <!-- Centre of curvature marker -->
  <circle cx="196" cy="100" r="3" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
  <text x="196" y="93" font-family="Arial,sans-serif" font-size="6" fill="#fbbf24" text-anchor="middle" opacity="0.5">C</text>

  <!-- Focal point marker -->
  <circle cx="218" cy="100" r="3" fill="#fbbf24" opacity="0.6" filter="url(#glow2)"/>
  <text x="218" y="93" font-family="Arial,sans-serif" font-size="6" fill="#fbbf24" text-anchor="middle" opacity="0.7">F</text>

  <!-- Object (arrow) -->
  <line x1="80" y1="100" x2="80" y2="68" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>
  <polygon points="80,60 76,70 84,70" fill="#ffffff" opacity="0.85"/>
  <!-- Object label -->
  <text x="72" y="112" font-family="Arial,sans-serif" font-size="7" fill="#aaaacc" opacity="0.7">Object</text>

  <!-- Light rays from object tip -->
  <!-- Ray 1: parallel to axis → reflects through F -->
  <line x1="80" y1="68" x2="218" y2="68" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
  <line x1="218" y1="68" x2="218" y2="100" stroke="#fbbf24" stroke-width="1" opacity="0.5" stroke-dasharray="3 2"/>
  <!-- Ray 2: through C → reflects back on itself (simplified) -->
  <line x1="80" y1="68" x2="196" y2="100" stroke="#fbbf24" stroke-width="1" opacity="0.55"/>
  <!-- Ray 3: converging to image point -->
  <line x1="218" y1="100" x2="155" y2="82" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
  <line x1="196" y1="100" x2="155" y2="82" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>

  <!-- Image (inverted arrow) -->
  <line x1="155" y1="100" x2="155" y2="82" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
  <polygon points="155,108 151,98 159,98" fill="#f97316" opacity="0.8"/>
  <text x="160" y="112" font-family="Arial,sans-serif" font-size="6.5" fill="#f97316" opacity="0.75">Image</text>

  <!-- Lamp/source glow left -->
  <ellipse cx="44" cy="100" rx="30" ry="30" fill="url(#lampGlow)" filter="url(#glow4)"/>
  <rect x="34" y="92" width="18" height="16" rx="3" fill="#1a2535"/>
  <rect x="37" y="95" width="12" height="10" rx="2" fill="#fbbf24" opacity="0.85"/>
  <line x1="43" y1="90" x2="43" y2="86" stroke="#888" stroke-width="1.5"/>
  <circle cx="43" cy="84" r="3" fill="#555"/>

  <!-- Measurement annotation -->
  <line x1="80" y1="160" x2="218" y2="160" stroke="#4488ff" stroke-width="0.7" opacity="0.4"/>
  <line x1="80" y1="157" x2="80" y2="163" stroke="#4488ff" stroke-width="0.7" opacity="0.4"/>
  <line x1="218" y1="157" x2="218" y2="163" stroke="#4488ff" stroke-width="0.7" opacity="0.4"/>
  <text x="149" y="157" font-family="Arial,sans-serif" font-size="6" fill="#4488ff" text-anchor="middle" opacity="0.5">u</text>

  <!-- Title bar -->
  <rect x="0" y="170" width="280" height="30" fill="#040810" opacity="0.95"/>
  <line x1="0" y1="170" x2="280" y2="170" stroke="#fbbf24" stroke-width="0.7" opacity="0.4"/>
  <text x="140" y="183" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="2">MIRROR LAB</text>
  <text x="140" y="195" font-family="Georgia,serif" font-size="6.5" fill="#aaaacc" text-anchor="middle" letter-spacing="1.2" opacity="0.75">Reflection of Light · Physics</text>
</svg>
