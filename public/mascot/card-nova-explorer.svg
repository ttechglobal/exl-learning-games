<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <!-- Deep forest night background -->
  <rect width="280" height="200" fill="#0a1a0e"/>

  <!-- Stars -->
  <circle cx="18" cy="14" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="45" cy="8" r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="72" cy="18" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="230" cy="12" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="255" cy="6" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="268" cy="22" r="0.7" fill="#ffffff" opacity="0.4"/>

  <!-- Far background: jungle canopy silhouette -->
  <ellipse cx="40" cy="195" rx="55" ry="35" fill="#0d2010" opacity="0.9"/>
  <ellipse cx="240" cy="198" rx="60" ry="32" fill="#0d2010" opacity="0.9"/>
  <ellipse cx="140" cy="200" rx="90" ry="30" fill="#071408" opacity="0.8"/>

  <!-- Left stone pillar -->
  <rect x="0" y="60" width="28" height="140" rx="4" fill="#1a2e1c" opacity="0.9"/>
  <rect x="4" y="64" width="20" height="130" rx="3" fill="#162818" opacity="0.6"/>
  <!-- pillar carvings -->
  <rect x="8" y="80" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>
  <rect x="8" y="95" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>
  <rect x="8" y="110" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>

  <!-- Right stone pillar -->
  <rect x="252" y="55" width="28" height="145" rx="4" fill="#1a2e1c" opacity="0.9"/>
  <rect x="256" y="60" width="20" height="134" rx="3" fill="#162818" opacity="0.6"/>
  <rect x="260" y="78" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>
  <rect x="260" y="93" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>
  <rect x="260" y="108" width="12" height="2" rx="1" fill="#2a4a2c" opacity="0.8"/>

  <!-- Torch glow left -->
  <ellipse cx="14" cy="62" rx="18" ry="22" fill="#c9a227" opacity="0.08"/>
  <!-- Torch left -->
  <rect x="10" y="52" width="8" height="14" rx="2" fill="#4a3010"/>
  <ellipse cx="14" cy="52" rx="5" ry="6" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="14" cy="50" rx="3" ry="4" fill="#ffcc44" opacity="0.95"/>

  <!-- Torch glow right -->
  <ellipse cx="266" cy="57" rx="18" ry="22" fill="#c9a227" opacity="0.08"/>
  <!-- Torch right -->
  <rect x="262" y="47" width="8" height="14" rx="2" fill="#4a3010"/>
  <ellipse cx="266" cy="47" rx="5" ry="6" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="266" cy="45" rx="3" ry="4" fill="#ffcc44" opacity="0.95"/>

  <!-- Central ground glow from the tablet -->
  <ellipse cx="140" cy="155" rx="80" ry="20" fill="#c9a227" opacity="0.06"/>

  <!-- Ancient stone tablet -->
  <rect x="52" y="36" width="176" height="130" rx="10" fill="#1e3020"/>
  <rect x="55" y="39" width="170" height="124" rx="8" fill="#162818"/>
  <!-- Tablet weathering texture -->
  <rect x="60" y="44" width="160" height="114" rx="6" fill="#0e1e10" opacity="0.5"/>
  <!-- Tablet border glow (active, formula inside) -->
  <rect x="55" y="39" width="170" height="124" rx="8" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>

  <!-- Tablet header: "ANCIENT FORMULA" -->
  <text x="140" y="60" font-family="Georgia, serif" font-size="7.5" font-weight="700" fill="#c9a227" text-anchor="middle" letter-spacing="2.5" opacity="0.85">ANCIENT FORMULA</text>

  <!-- Thin divider below header -->
  <line x1="80" y1="65" x2="200" y2="65" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>

  <!-- Main formula: A = πr² -->
  <text x="140" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">A = πr²</text>

  <!-- Divider above target -->
  <line x1="80" y1="116" x2="200" y2="116" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>

  <!-- Target variable badge -->
  <rect x="101" y="122" width="78" height="26" rx="6" fill="#c9a227" opacity="0.15"/>
  <rect x="101" y="122" width="78" height="26" rx="6" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.55"/>
  <text x="140" y="134" font-family="Georgia, serif" font-size="7" fill="#c9a227" text-anchor="middle" letter-spacing="1.5" opacity="0.8">UNCOVER</text>
  <!-- Glowing "r" -->
  <text x="140" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="800" fill="#c9a227" text-anchor="middle">r</text>

  <!-- Layer lock icons (right side, subtle) -->
  <rect x="212" y="80" width="10" height="8" rx="2" fill="none" stroke="#3ecf8e" stroke-width="1" opacity="0.5"/>
  <path d="M214 80 Q217 75 220 80" stroke="#3ecf8e" stroke-width="1" fill="none" opacity="0.5"/>
  <rect x="212" y="96" width="10" height="8" rx="2" fill="none" stroke="#3ecf8e" stroke-width="1" opacity="0.4"/>
  <path d="M214 96 Q217 91 220 96" stroke="#3ecf8e" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Lock labels -->
  <text x="207" y="86" font-family="monospace" font-size="4.5" fill="#3ecf8e" text-anchor="end" opacity="0.6">π</text>
  <text x="207" y="103" font-family="monospace" font-size="4.5" fill="#3ecf8e" text-anchor="end" opacity="0.5">r²</text>

  <!-- Nova's compass bottom-left on tablet -->
  <circle cx="78" cy="148" r="8" fill="#0a1a0c" stroke="#c9a227" stroke-width="1" opacity="0.7"/>
  <line x1="78" y1="141" x2="78" y2="148" stroke="#c9a227" stroke-width="1.2" opacity="0.8"/>
  <line x1="78" y1="148" x2="83" y2="152" stroke="#4a3010" stroke-width="1.2" opacity="0.7"/>
  <circle cx="78" cy="148" r="1.5" fill="#c9a227" opacity="0.9"/>

  <!-- Bottom label bar -->
  <rect x="52" y="168" width="176" height="28" rx="0" fill="#071408" opacity="0.85"/>
  <rect x="52" y="168" width="176" height="28" rx="0" fill="none" stroke="#c9a227" stroke-width="0" opacity="0"/>
  <!-- Game title -->
  <text x="140" y="180" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#c9a227" text-anchor="middle" letter-spacing="1.5">NOVA THE EXPLORER</text>
  <text x="140" y="191" font-family="Georgia, serif" font-size="6" fill="#3ecf8e" text-anchor="middle" letter-spacing="1" opacity="0.8">Change of Subject</text>

  <!-- Vine details top corners -->
  <path d="M52 36 Q40 32 36 44" stroke="#1a4020" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="36" cy="44" r="3" fill="#1a4020" opacity="0.6"/>
  <path d="M228 36 Q240 32 244 48" stroke="#1a4020" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="244" cy="48" r="3" fill="#1a4020" opacity="0.6"/>
</svg>
